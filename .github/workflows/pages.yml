name: Deploy to GitHub Pages

# Publishes the repo (a single self-contained index.html) to GitHub Pages.
# `configure-pages` with enablement:true turns Pages on automatically the first
# time this runs, so no manual toggle in repo Settings is required.

on:
  push:
    branches:
      - claude/midi-learning-synthesia-app-9jtl6i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
